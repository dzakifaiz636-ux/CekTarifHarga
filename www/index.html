<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PatyStore</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(160deg, #05060f, #0b0f2b, #150a34);
}

.container {
  width: 100%;
  max-width: 430px;
  margin: auto;
  padding: 22px 16px 40px;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;

  background: linear-gradient(
    135deg,
    #3b82f6,
    #9333ea
  );
}

h1 {
  margin: 0;
  font-size: 19px;
}

.subtitle {
  margin-top: 4px;
  color: #94a3b8;
  font-size: 12px;
}

.search {
  margin-top: 20px;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 14px;

  border-radius: 15px;

  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
}

.search input {
  width: 100%;

  border: none;
  outline: none;

  color: white;
  background: transparent;

  font-size: 14px;
}

.search input::placeholder {
  color: #64748b;
}

.content {
  margin-top: 20px;
  min-height: 250px;
}

.empty {
  padding: 45px 10px;
  text-align: center;
  color: #94a3b8;
}

.card {
  margin-bottom: 12px;
  padding: 15px;

  border-radius: 17px;

  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
}

.card-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.nama {
  font-size: 15px;
  font-weight: bold;
}

.merek {
  margin-top: 4px;
  color: #94a3b8;
  font-size: 12px;
}

.kategori {
  display: inline-block;

  margin-top: 7px;
  padding: 5px 8px;

  border-radius: 20px;

  color: #67e8f9;
  background: rgba(34,211,238,.1);

  font-size: 10px;
}

.harga {
  height: fit-content;
  white-space: nowrap;

  padding: 8px 10px;

  border-radius: 10px;

  font-size: 13px;
  font-weight: bold;

  background: linear-gradient(
    135deg,
    #3b82f6,
    #9333ea
  );
}

.main-btn {
  width: 100%;

  padding: 15px;

  border: none;
  border-radius: 15px;

  color: white;

  font-size: 14px;
  font-weight: bold;

  background: linear-gradient(
    90deg,
    #3b82f6,
    #9333ea
  );
}

.data-buttons {
  display: flex;
  gap: 9px;

  margin-top: 10px;
}

.data-btn {
  flex: 1;

  padding: 13px 5px;

  border-radius: 14px;

  color: white;

  font-size: 12px;
  font-weight: bold;

  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.1);

  cursor: pointer;
}

button {
  cursor: pointer;
}

.small-buttons {
  display: flex;
  gap: 8px;

  margin-top: 13px;
  padding-top: 12px;

  border-top: 1px solid rgba(255,255,255,.1);
}

.small-btn {
  flex: 1;

  padding: 10px;

  border: none;
  border-radius: 11px;

  color: white;

  font-weight: bold;

  background: rgba(255,255,255,.07);
}

.delete {
  color: #fda4af;
  background: rgba(244,63,94,.1);
}

.modal {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;
  align-items: flex-end;
  justify-content: center;

  background: rgba(0,0,0,.7);
}

.modal-box {
  width: 100%;
  max-width: 430px;

  padding: 22px;

  border-radius: 25px 25px 0 0;

  background: linear-gradient(
    160deg,
    #0b0f2b,
    #150a34
  );
}

.modal-box h2 {
  margin-top: 0;
}

.input {
  width: 100%;

  margin-bottom: 10px;
  padding: 13px;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px;

  outline: none;

  color: white;
  background: rgba(255,255,255,.06);
}

.input::placeholder {
  color: #64748b;
}

.modal-buttons {
  display: flex;
  gap: 8px;
}

.modal-buttons button {
  flex: 1;

  padding: 13px;

  border: none;
  border-radius: 12px;

  color: white;
  font-weight: bold;
}

.cancel {
  background: rgba(255,255,255,.08);
}

.save {
  background: linear-gradient(
    90deg,
    #3b82f6,
    #9333ea
  );
}

.error {
  margin-bottom: 10px;

  color: #fda4af;

  font-size: 12px;
}

input[type="file"] {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      ✨
    </div>

    <div>
      <h1>CEK TARIF HARGA BARANG</h1>

      <div class="subtitle">
        PatyStore • Data Barang
      </div>
    </div>

  </div>


  <div class="search">

    🔍

    <input
      id="search"
      type="text"
      placeholder="Cari nama atau merek barang..."
      oninput="tampilkanBarang()"
    >

  </div>


  <div
    id="content"
    class="content"
  ></div>


  <button
    class="main-btn"
    onclick="bukaTambah()"
  >
    ＋ Tambah Barang
  </button>


  <div class="data-buttons">

    <button
      class="data-btn"
      onclick="exportData()"
    >
      📤 Export Data
    </button>


    <label
      class="data-btn"
      style="text-align:center"
    >

      📥 Import Data

      <input
        type="file"
        accept=".json,application/json"
        onchange="importData(event)"
      >

    </label>

  </div>

</div>


<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <h2 id="modalTitle">
      Tambah Barang
    </h2>


    <input
      id="nama"
      class="input"
      placeholder="Nama Barang"
    >


    <input
      id="merek"
      class="input"
      placeholder="Merek"
    >


    <input
      id="harga"
      class="input"
      type="number"
      placeholder="Harga"
    >


    <input
      id="kategori"
      class="input"
      placeholder="Kategori"
    >


    <div
      id="error"
      class="error"
    ></div>


    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="tutupModal()"
      >
        Batal
      </button>


      <button
        class="save"
        onclick="simpanBarang()"
      >
        Simpan
      </button>

    </div>

  </div>

</div>


<script>

const DATA_AWAL = [
  {
    id: 1,
    nama: "Indomie Goreng",
    merek: "Indomie",
    harga: 3500,
    kategori: "Makanan Instan"
  },

  {
    id: 2,
    nama: "Aqua 600 ml",
    merek: "Aqua",
    harga: 4000,
    kategori: "Minuman"
  },

  {
    id: 3,
    nama: "Teh Botol Sosro",
    merek: "Sosro",
    harga: 5000,
    kategori: "Minuman"
  }
];


let barangList =
  JSON.parse(
    localStorage.getItem("PatyStoreData")
  ) || DATA_AWAL;


let editingId = null;


function simpanLocal() {

  localStorage.setItem(
    "PatyStoreData",
    JSON.stringify(barangList)
  );

}


function rupiah(angka) {

  return "Rp" +
    Number(angka)
      .toLocaleString("id-ID");

}


function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function tampilkanBarang() {

  const query =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const content =
    document.getElementById("content");


  if (!query) {

    content.innerHTML = `
      <div class="empty">
        🔎
        <h3>Mulai mencari barang</h3>
        <p>Ketik nama atau merek barang.</p>
      </div>
    `;

    return;

  }


  const hasil =
    barangList.filter(b =>

      b.nama
        .toLowerCase()
        .includes(query)

      ||

      b.merek
        .toLowerCase()
        .includes(query)

    );


  if (hasil.length === 0) {

    content.innerHTML = `
      <div class="empty">
        ❌
        <h3>Barang tidak ditemukan</h3>
      </div>
    `;

    return;

  }


  content.innerHTML =
    hasil.map(b => `

      <div class="card">

        <div class="card-top">

          <div>

            <div class="nama">
              ${escapeHTML(b.nama)}
            </div>

            <div class="merek">
              Merek:
              ${escapeHTML(b.merek)}
            </div>

            <span class="kategori">
              ${escapeHTML(b.kategori)}
            </span>

          </div>


          <div class="harga">
            ${rupiah(b.harga)}
          </div>

        </div>


        <div class="small-buttons">

          <button
            class="small-btn"
            onclick="bukaEdit(${b.id})"
          >
            ✏️ Edit
          </button>


          <button
            class="small-btn delete"
            onclick="hapusBarang(${b.id})"
          >
            🗑️ Hapus
          </button>

        </div>

      </div>

    `).join("");

}


function bukaTambah() {

  editingId = null;


  document
    .getElementById("modalTitle")
    .textContent = "Tambah Barang";


  document.getElementById("nama").value = "";
  document.getElementById("merek").value = "";
  document.getElementById("harga").value = "";
  document.getElementById("kategori").value = "";
  document.getElementById("error").textContent = "";


  document
    .getElementById("modal")
    .style.display = "flex";

}


function bukaEdit(id) {

  const barang =
    barangList.find(
      b => b.id === id
    );


  if (!barang) return;


  editingId = id;


  document
    .getElementById("modalTitle")
    .textContent = "Edit Barang";


  document.getElementById("nama").value =
    barang.nama;

  document.getElementById("merek").value =
    barang.merek;

  document.getElementById("harga").value =
    barang.harga;

  document.getElementById("kategori").value =
    barang.kategori;

  document.getElementById("error").textContent = "";


  document
    .getElementById("modal")
    .style.display = "flex";

}


function tutupModal() {

  document
    .getElementById("modal")
    .style.display = "none";

}


function simpanBarang() {

  const nama =
    document
      .getElementById("nama")
      .value
      .trim();


  const merek =
    document
      .getElementById("merek")
      .value
      .trim();


  const harga =
    Number(
      document
        .getElementById("harga")
        .value
    );


  const kategori =
    document
      .getElementById("kategori")
      .value
      .trim();


  const error =
    document.getElementById("error");


  if (
    !nama ||
    !merek ||
    !harga ||
    !kategori
  ) {

    error.textContent =
      "Semua kolom harus diisi.";

    return;

  }


  if (harga <= 0) {

    error.textContent =
      "Harga harus lebih dari 0.";

    return;

  }


  if (editingId !== null) {

    const index =
      barangList.findIndex(
        b => b.id === editingId
      );


    if (index !== -1) {

      barangList[index] = {

        id: editingId,

        nama: nama,

        merek: merek,

        harga: harga,

        kategori: kategori

      };

    }

  } else {

    barangList.unshift({

      id: Date.now(),

      nama: nama,

      merek: merek,

      harga: harga,

      kategori: kategori

    });

  }


  simpanLocal();

  tutupModal();

  tampilkanBarang();

}


function hapusBarang(id) {

  const barang =
    barangList.find(
      b => b.id === id
    );


  if (!barang) return;


  if (
    !confirm(
      `Hapus "${barang.nama}"?`
    )
  ) {

    return;

  }


  barangList =
    barangList.filter(
      b => b.id !== id
    );


  simpanLocal();

  tampilkanBarang();

}


/* =================================
   EXPORT PATYSTORE.JSON
   ================================= */

async function exportData() {

  try {

    const data =
      JSON.stringify(
        barangList,
        null,
        2
      );


    /* Capacitor Android */

    if (
      window.Capacitor &&
      window.Capacitor.isNativePlatform()
    ) {

      const Filesystem =
        window.Capacitor.Plugins.Filesystem;

      const Share =
        window.Capacitor.Plugins.Share;


      if (!Filesystem || !Share) {

        throw new Error(
          "Plugin Capacitor belum tersedia."
        );

      }


      /* Buat file di penyimpanan cache aplikasi */

      const result =
        await Filesystem.writeFile({

          path: "PatyStore.json",

          data: data,

          directory: "CACHE",

          encoding: "utf8"

        });


      /* Ambil URI file */

      const uriResult =
        await Filesystem.getUri({

          path: "PatyStore.json",

          directory: "CACHE"

        });


      /* Buka Android Share Sheet */

      await Share.share({

        title: "PatyStore",

        text: "Data PatyStore",

        url: uriResult.uri,

        dialogTitle:
          "Bagikan PatyStore.json"

      });


      return;

    }


    /* Jika dibuka sebagai website */

    const blob =
      new Blob(
        [data],
        {
          type: "application/json"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href = url;

    a.download =
      "PatyStore.json";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(url);


  } catch (error) {

    console.error(error);

    alert(
      "Gagal melakukan Export Data."
    );

  }

}


/* =================================
   IMPORT PATYSTORE.JSON
   ================================= */

function importData(event) {

  const file =
    event.target.files?.[0];


  if (!file) return;


  if (
    !file.name
      .toLowerCase()
      .endsWith(".json")
  ) {

    alert(
      "Pilih file PatyStore.json."
    );

    event.target.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const data =
          JSON.parse(
            e.target.result
          );


        if (!Array.isArray(data)) {

          throw new Error();

        }


        const valid =
          data.every(b =>
            b &&
            b.nama &&
            b.merek &&
            b.harga &&
            b.kategori
          );


        if (!valid) {

          throw new Error();

        }


        const yakin =
          confirm(
            `Import ${data.length} barang?\n\nData yang sekarang akan diganti.`
          );


        if (!yakin) {

          event.target.value = "";

          return;

        }


        barangList =
          data.map(
            (b, index) => ({

              id:
                Date.now() + index,

              nama:
                String(b.nama),

              merek:
                String(b.merek),

              harga:
                Number(b.harga),

              kategori:
                String(b.kategori)

            })
          );


        simpanLocal();

        tampilkanBarang();


        alert(
          `Berhasil mengimpor ${barangList.length} barang.`
        );


      } catch (error) {

        alert(
          "File tidak valid.\n\nGunakan file PatyStore.json hasil Export Data."
        );

      }


      event.target.value = "";

    };


  reader.readAsText(file);

}


tampilkanBarang();

</script>

</body>
</html>
